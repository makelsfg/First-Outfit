<svg width="632" height="420" viewBox="0 0 632 420" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="180" height="150" rx="14" fill="rgba(249,115,22,0.10)" /><text x="106" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#2B2B33">输入条件</text><text x="106" y="86" text-anchor="middle" font-size="16" fill="#6B6B75">实时气温 / 时段</text><text x="106" y="112" text-anchor="middle" font-size="16" fill="#6B6B75">场合 × 5</text><text x="106" y="138" text-anchor="middle" font-size="16" fill="#6B6B75">性别 + 怕冷程度</text><rect x="246" y="20" width="150" height="150" rx="14" fill="#F97316" /><text x="321" y="88" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">规则引擎</text><text x="321" y="118" text-anchor="middle" font-size="15" fill="#FFFFFF">outfitRules.ts</text><rect x="446" y="20" width="170" height="150" rx="14" fill="rgba(43,43,51,0.9)" /><text x="531" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">输出 3 套方案</text><text x="531" y="86" text-anchor="middle" font-size="15" fill="#FFFFFF">推荐 / 更保暖</text><text x="531" y="110" text-anchor="middle" font-size="15" fill="#FFFFFF">更轻便 / 换个样式</text><text x="531" y="140" text-anchor="middle" font-size="15" fill="#FFFFFF">「换一套 (x/3)」</text><line x1="196" y1="95" x2="242" y2="95" stroke="#F97316" stroke-width="3" /><line x1="396" y1="95" x2="442" y2="95" stroke="#F97316" stroke-width="3" /><rect x="16" y="200" width="600" height="200" rx="14" fill="rgba(249,115,22,0.06)" /><text x="40" y="236" font-size="19" font-weight="bold" fill="#2B2B33">每套方案都包含：</text><text x="40" y="272" font-size="16" fill="#2B2B33">· 上装 / 内搭 / 外套 / 下装 / 鞋子 + 一句话结论</text><text x="40" y="304" font-size="16" fill="#2B2B33">· 「为什么这样穿」逐条理由（气温、场合、个人偏好）</text><text x="40" y="336" font-size="16" fill="#2B2B33">· 天气提醒：带伞 / 大风 / 早晚温差 / 防晒</text><text x="40" y="372" font-size="16" fill="#F97316" font-weight="bold">· 性别硬边界：男 / 未透露绝不出裙装（数据层 + 运行时双重过滤）</text></svg>