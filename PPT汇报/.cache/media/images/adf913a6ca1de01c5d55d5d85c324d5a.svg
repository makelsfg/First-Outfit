<svg width="780" height="470" viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="14" width="760" height="120" rx="16" fill="#FFE3CC" /><text x="30" y="46" font-size="20" font-weight="bold" fill="#2B2B33">① 小程序端（TypeScript）</text><text x="30" y="80" font-size="15.5" fill="#2B2B33">pages：今日推荐 / 我的衣橱 / 客服问答 / 设置</text><text x="30" y="108" font-size="15.5" fill="#2B2B33">utils：outfitRules 规则引擎 · weather 天气 · llm 流式封装 · wardrobe 衣橱</text><rect x="10" y="176" width="760" height="120" rx="16" fill="#F97316" /><text x="30" y="208" font-size="20" font-weight="bold" fill="#FFFFFF">② 微信云函数（密钥全在服务端）</text><text x="30" y="242" font-size="15.5" fill="#FFFFFF">getWeather 代理高德 · askLLM 代理百炼 · initData 建集合 · submitFeedback</text><text x="30" y="270" font-size="15.5" fill="#FFF3E8">云数据库（衣物 / 对话 / 流式缓冲）+ 云存储（衣物照片）</text><rect x="10" y="338" width="760" height="120" rx="16" fill="#FB923C" /><text x="30" y="370" font-size="20" font-weight="bold" fill="#FFFFFF">③ 第三方服务</text><text x="30" y="404" font-size="15.5" fill="#FFFFFF">高德开放平台：逆地理编码 + 实况/预报天气</text><text x="30" y="432" font-size="15.5" fill="#FFFFFF">阿里云百炼 DashScope：DeepSeek 模型（OpenAI 兼容接口，stream: true）</text><line x1="390" y1="134" x2="390" y2="172" stroke="#F97316" stroke-width="4" /><line x1="390" y1="296" x2="390" y2="334" stroke="#F97316" stroke-width="4" /></svg>